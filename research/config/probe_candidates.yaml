# APK-accurate Hazel writes (ChromaFirmwareEffectFactoryProtocol3): try these first.
# {r} {g} {b} = 0-255. {fan} = 0 off, 1 low, 2 high.

external_color:
 - name: hazel_zone5_static_apk
 writes:
 - "{req:02x} 07 00 00 10 03 00 05"
 - "01 00 00 01 {r:02x} {g:02x} {b:02x}"
 - name: hazel_zone5_brightness_apk
 writes:
 - "{req:02x} 01 00 00 10 05 00 05"
 - "{brightness:02x}"
 - name: mouse_two_packet
 writes:
 - "{req:02x} 08 00 00 10 04 00 00"
 - "04 00 00 00 00 {r:02x} {g:02x} {b:02x}"
 - name: mouse_single_packet
 writes:
 - "{req:02x} 08 00 00 10 04 00 00 04 00 00 00 00 {r:02x} {g:02x} {b:02x}"
 - name: mouse_alt_key_10040101
 writes:
 - "{req:02x} 08 00 00 10 04 01 01"
 - "04 00 00 00 00 {r:02x} {g:02x} {b:02x}"
 - name: mouse_alt_key_10040100
 writes:
 - "{req:02x} 08 00 00 10 04 01 00"
 - "04 00 00 00 00 {r:02x} {g:02x} {b:02x}"
 - name: key_11040000_two_packet
 writes:
 - "{req:02x} 08 00 00 11 04 00 00"
 - "04 00 00 00 00 {r:02x} {g:02x} {b:02x}"
 - name: key_04040000_two_packet
 writes:
 - "{req:02x} 08 00 00 04 04 00 00"
 - "04 00 00 00 00 {r:02x} {g:02x} {b:02x}"
 - name: rgb_payload_only_marker
 writes:
 - "{req:02x} 04 00 00 10 04 00 00"
 - "00 {r:02x} {g:02x} {b:02x}"
 - name: rgb_no_prefix_byte
 writes:
 - "{req:02x} 03 00 00 10 04 00 00"
 - "{r:02x} {g:02x} {b:02x}"

