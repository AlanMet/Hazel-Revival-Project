# Stop spectrum (mode 0) then set legacy frame color: try before raw color probes.
external_static_then_color:
 - name: static_mode_then_legacy_red
 writes:
 - "{req:02x} 04 00 00 10 03 00 00"
 - "00 00 00 00"
 - "{req:02x} 08 00 00 10 04 00 00"
 - "04 00 00 00 00 {r:02x} {g:02x} {b:02x}"
