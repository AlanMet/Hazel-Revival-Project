# Internal mouth light: zone 0x01 (Hazel applyFirmwareEffect).
internal_light:
 - name: hazel_zone1_static_apk
 writes:
 - "{req:02x} 07 00 00 10 03 00 01"
 - "01 00 00 01 {r:02x} {g:02x} {b:02x}"
 - name: hazel_zone1_off_apk
 writes:
 - "{req:02x} 01 00 00 10 03 00 01"
 - "00"
