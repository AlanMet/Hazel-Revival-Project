 - "01 00 00 01 {r:02x} {g:02x} {b:02x} 00 00 00"

# Fan speed: APK Hazel.createSetFanSpeed (class 0x11). Notify mirror: 52401526 `05 39 XX`.
fan_speed:
 - name: hazel_fan_apk
 writes:
 - "{req:02x} 06 00 00 11 01 01 00"
 - "01 00 {fan:02x} 00 {fan:02x} 00"
 - name: mirror_prefix_u8
 writes:
 - "{req:02x} 01 00 00 05 39 00 00"
 - "{fan:02x}"
 - name: mirror_prefix_single
 writes:
 - "{req:02x} 01 00 00 05 39 00 {fan:02x}"
 - name: mirror_full_frame
 writes:
 - "{req:02x} 08 00 00 05 39 00 00"
 - "{fan:02x} 00 00 00 00 00 00 00"
 - name: class10_fan
 writes:
 - "{req:02x} 01 00 00 10 39 00 00"
 - "{fan:02x}"
 - name: class10_fan_zone01
 writes:
 - "{req:02x} 01 00 00 10 39 00 01"
 - "{fan:02x}"
