# Vendor READ commands: one write frame each, collect notify replies.
# These are cheap: use before brute-forcing writes.

vendor_reads:
 - name: read_battery_key
 writes:
 - "{req:02x} 00 00 00 05 81 00 01"
 - name: read_color_key
 writes:
 - "{req:02x} 00 00 00 10 84 00 00"
 - name: read_brightness_key
 writes:
 - "{req:02x} 00 00 00 10 85 01 01"
 - name: read_effect_key
 writes:
 - "{req:02x} 00 00 00 10 83 00 00"
 - name: read_brightness_external_zone5
 writes:
 - "{req:02x} 00 00 00 10 85 00 05"
